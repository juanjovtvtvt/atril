<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Atril · Biblioteca en el celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#A8261B}
input::placeholder{color:#8A7B6E}
.press{transition:transform 160ms cubic-bezier(.23,1,.32,1)}
.press:active{transform:scale(.97)}
.seg{transition:background-color 200ms ease, box-shadow 200ms ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation-duration:160ms!important;animation-delay:0s!important}.press:active{transform:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F2EA; color: #2B2119; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased">
<div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 8px 16px 110px">

<div style="height: 44px; display: flex; align-items: center; justify-content: flex-end">
<button type="button" class="press" style="height: 32px; padding: 0 4px; border: 0; background: transparent; color: #A8261B; font: inherit; font-size: 17px; cursor: pointer">Ordenar</button>
</div>
<h1 style="margin: 0 0 10px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; font-size: 32px; line-height: 1.1; font-weight: 700; letter-spacing: -0.022em">Biblioteca</h1>
<div role="search" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; border-radius: 10px; background: rgba(118,96,72,0.12)">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6B5F55" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="search" aria-label="Buscar en la biblioteca" placeholder="Título, autor o nota" style="flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font: inherit; font-size: 17px; color: #2B2119">
</div>

<div role="group" aria-label="Filtrar" style="margin-top: 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 9px; background: rgba(118,96,72,0.12)">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" class="seg" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="height: 30px; padding: 0 2px; border: 0; border-radius: 7px; background: {{f.bg}}; box-shadow: {{f.shadow}}; color: #2B2119; font: inherit; font-size: 13px; font-weight: {{f.weight}}; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>

<div style="margin: 14px 0 10px; font-size: 13px; color: #6B5F55">{{countLabel}}</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 14px">
<sc-for list="{{shown}}" as="b" hint-placeholder-count="6">
<a href="Lector-Movil.dc.html" class="press" style="display: flex; flex-direction: column; gap: 5px; min-width: 0; color: #2B2119; text-decoration: none; animation: rise 260ms cubic-bezier(.23,1,.32,1) {{b.delay}}ms both">
<span style="aspect-ratio: 2 / 3; position: relative; overflow: hidden; box-sizing: border-box; padding: 9px 6px 9px 12px; border-radius: 2px 5px 5px 2px; background: {{b.bg}}; color: #F4E9D6; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 1px 2px rgba(43,33,25,0.16), 0 6px 14px rgba(43,33,25,0.14)">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: rgba(0,0,0,0.22)"></span>
<span style="font-family: ui-serif, 'New York', 'Iowan Old Style', Charter, Cambria, Georgia, serif; font-size: 12px; font-weight: 600; line-height: 1.15">{{b.title}}</span>
<span style="font-size: 7px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.8">{{b.author}}</span>
</span>
<span style="font-size: 13px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{b.title}}</span>
<span style="font-size: 12px; color: {{b.statusColor}}; margin-top: -3px; font-variant-numeric: tabular-nums">{{b.status}}</span>
</a>
</sc-for>
</div>
</div>

<nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; box-sizing: border-box; padding: 6px 4px 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: rgba(247,242,234,0.8); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 -0.5px 0 rgba(43,33,25,0.14)">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
<a href="{{tb.href}}" aria-current="{{tb.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{tb.color}}; text-decoration: none; font-size: 10px; font-weight: 600">
<svg aria-hidden="true" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{tb.icon}}"></path></svg>{{tb.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'todos' };
  }
  renderVals() {
    const s = this.state;
    const books = [
      { title: 'Don Quijote de la Mancha', author: 'Cervantes', bg: '#4B2716', pct: 18, group: 'leyendo' },
      { title: 'El olvido que seremos', author: 'Abad Faciolince', bg: '#6E6B3E', pct: 42, group: 'leyendo' },
      { title: 'La vorágine', author: 'J. E. Rivera', bg: '#8C5A2E', pct: 63, group: 'leyendo' },
      { title: 'Designing Data-Intensive Applications', author: 'Kleppmann', bg: '#2B2119', pct: 27, group: 'leyendo' },
      { title: 'Redes · Unidad 3', author: 'PDF convertido', bg: '#A8261B', group: 'porleer', label: 'Nuevo' },
      { title: 'Cien años de soledad', author: 'García Márquez', bg: '#C07A2C', group: 'porleer', label: 'Sin empezar' },
      { title: 'María', author: 'Jorge Isaacs', bg: '#A8261B', group: 'leidos', label: 'Leído' },
      { title: 'Pedro Páramo', author: 'Juan Rulfo', bg: '#6E6B3E', group: 'leidos', label: 'Leído' },
      { title: 'Ficciones', author: 'J. L. Borges', bg: '#4B2716', group: 'leidos', label: 'Leído' }
    ].map((b) => ({
      ...b,
      status: b.group === 'leyendo' ? b.pct + ' %' : b.label,
      statusColor: b.label === 'Nuevo' ? '#A8261B' : '#6B5F55'
    }));
    const defs = [{ id: 'todos', label: 'Todos' }, { id: 'leyendo', label: 'Leyendo' }, { id: 'porleer', label: 'Por leer' }, { id: 'leidos', label: 'Leídos' }];
    const filters = defs.map((f) => ({
      ...f, on: s.filter === f.id,
      bg: s.filter === f.id ? '#FFFCF7' : 'transparent',
      shadow: s.filter === f.id ? '0 1px 3px rgba(43,33,25,0.14), 0 0 0 0.5px rgba(43,33,25,0.06)' : 'none',
      weight: s.filter === f.id ? 600 : 500,
      pick: () => this.setState({ filter: f.id })
    }));
    const shown = (s.filter === 'todos' ? books : books.filter((b) => b.group === s.filter)).map((b, i) => ({ ...b, delay: i * 35 }));
    return {
      filters,
      shown,
      countLabel: shown.length + (shown.length === 1 ? ' libro' : ' libros'),
      tabs: [
        { href: 'Inicio-Movil.dc.html', label: 'Inicio', color: '#7A6D62', current: 'false', icon: 'M3 10.5 12 3l9 7.5 M5 9.5V20h14V9.5' },
        { href: 'Biblioteca-Movil.dc.html', label: 'Biblioteca', color: '#A8261B', current: 'page', icon: 'M3 20h18 M5 20V6h3v14 M9.5 20V4h3v16 M14 20l-1-13 3-.6 2 13.4' },
        { href: 'Convertidor.dc.html', label: 'Convertir', color: '#7A6D62', current: 'false', icon: 'M4 8h13l-3-3 M20 16H7l3 3' },
        { href: 'Notas-PC.dc.html', label: 'Notas', color: '#7A6D62', current: 'false', icon: 'M6 3h9l3 3v15H6z M9 9h6 M9 13h6 M9 17h4' }
      ]
    };
  }
}
</script>
</body>
</html>
